
name: Build Split Bill 3 APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify project files
        run: |
          echo "Checking Gradle configuration..."
          ls -la
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          echo "Checking Android source files..."
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/splitbill3/MainActivity.java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Gradle projects
        run: gradle --no-daemon projects

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SplitBill3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
